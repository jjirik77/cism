      items: [
        { text: 'A dispatcher mistyped her VPN password once, then logged in normally from her usual laptop.', answer: 0, why: 'A single failed login with a normal follow-up is an observable occurrence with no threat. It is logged as an event.' },
        { text: 'The email gateway blocked a known phishing campaign. Logs confirm no message reached a mailbox.', answer: 0, why: 'The control worked and nothing was harmed. A blocked attempt is an event to log and watch for trends.' },

        { text: 'A project coordinator pasted a non-sensitive internal project timeline into a public generative AI chatbot, against the acceptable use policy.', answer: 1, why: 'A policy violation by one user with no sensitive data is a low-severity incident. It is handled, recorded, and tracked for trends.' },
        { text: 'An accounts payable clerk joined a video call with what looked and sounded like the CFO and wired $480,000 to a new supplier account. The CFO was on a flight at the time.', answer: 3, why: 'Deepfake-enabled payment fraud of $480,000 is far above the $50,000 line. It is Sev 1 and needs immediate escalation so the bank can try to recall the funds.' },

          parts: [
            { q: 'What should Daniela do FIRST?', options: ['Wait for the SOC analysis so the escalation is based on facts', 'Escalate to the CFO and legal, and start a bank recall of the wire', 'Ask internal audit to review the accounts payable approval controls now', 'Email all staff a warning about deepfake video calls'], answer: 1, why: 'Fraud above the threshold escalates immediately, and a wire recall has the best chance in the first hours. Forensic analysis and control review can follow.' }

        },
        {
          title: 'Case 2: The chatbot exposure', text: 'The confirmed chatbot exposure includes about 40 customers who live in the EU. Legal counsel is at a conference until Monday, four days away.',

          ]
        },
        {

            { q: 'Who should decide whether to pay?', options: ['Daniela, as the manager leading the response', 'Senior management, advised by legal counsel', 'The cyber insurer, since it may cover the cost', 'The IT director, who owns the encrypted servers'], answer: 1, why: 'Paying is a business decision with legal, sanctions, and reputational risk. The security manager informs the decision, and senior management makes it with counsel.' },
            { q: 'What should Daniela ensure happens alongside that decision?', options: ['The payment is kept off the record to limit any reputational harm', 'Restores wait until the payment decision is final', 'The SOC negotiates directly with the attackers to buy time', 'The calls to counsel, law enforcement, and the insurer are made'], answer: 3, why: 'The plan defines who is notified and when, and those calls protect the organization whatever is decided. Concealment and ad hoc negotiation are not acceptable responses.' }
          ]
        },
        {
          title: 'Case 4: The payroll provider breach', text: 'The payroll SaaS provider has sent a short notice and is not answering follow-up questions. HR wants to email all employees today.',
          parts: [
            { q: 'What is the BEST first step?', options: ['Terminate the provider\'s contract and move payroll in-house', 'Let HR email employees now, before the facts are known', 'Invoke the contract\'s breach clause and have legal assess duties', 'Ask the provider for its latest SOC 2 report and wait for its reply'], answer: 2, why: 'The contract should require timely details, and legal decides what notice the organization owes. Accountability for employee data stays with Solano even when a vendor holds it.' }
          ]
        },
        {

            { q: 'What is Daniela\'s role while the specialists work?', concept: 'lead', options: ['Coordinate the team, decisions, and stakeholder updates', 'Run the containment commands herself to be certain they are done', 'Step back until the technical team reports that it is resolved', 'Draft the post-incident report while the event is fresh'], answer: 0, why: 'The manager directs and coordinates under the plan, including executive communication and the notification branch. Specialists execute the technical steps.' }

            { text: 'Preparation', rank: 0, why: 'Plans, roles, tools, training, and retainers are set up before an incident. It is the most important phase.' },
