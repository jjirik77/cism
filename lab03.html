<script>
/* ===================== Portfolio model (deterministic) =====================
   Crestline Parcel Company, FY2027 security investment. Five risk scenarios with
   SLE, ARO, and an appetite set by the Enterprise Risk Committee. Twelve candidate
   controls, each with an annual cost and a percentage reduction per scenario.
   Residual ALE combines controls multiplicatively. All answers are computed from
   these arrays, so the checklist key cannot drift from the charts. */
(function () {
  var SC = [
    { id: 'S1', name: 'Ransomware with data extortion', short: 'Ransomware', sle: 4000, aro: 0.30, appetite: 300, owner: 'Chief Operating Officer', desc: 'Encryption of the dispatch and routing platform plus theft of customer shipment data, with a leak-site extortion demand.' },
    { id: 'S2', name: 'Payment fraud through business email compromise and deepfake voice', short: 'Payment fraud', sle: 650, aro: 0.60, appetite: 120, owner: 'Chief Financial Officer', desc: 'A spoofed carrier-partner email and an AI-cloned voice call redirect a fuel or linehaul payment.' },
    { id: 'S3', name: 'Cloud misconfiguration exposing customer data', short: 'Cloud exposure', sle: 2000, aro: 0.20, appetite: 160, owner: 'Chief Technology Officer', desc: 'A public storage bucket or over-permissive role in the cloud tracking platform exposes shipper and recipient records.' },
    { id: 'S4', name: 'Breach at a critical SaaS or logistics partner', short: 'Third-party breach', sle: 1500, aro: 0.15, appetite: 150, owner: 'Chief Procurement Officer', desc: 'A compromise at the payroll, telematics, or customs-brokerage provider exposes Crestline data or halts operations.' },
    { id: 'S5', name: 'Insider data theft by a departing employee', short: 'Insider theft', sle: 800, aro: 0.25, appetite: 130, owner: 'Chief People Officer', desc: 'A departing sales or pricing employee takes the customer rate book and contract files to a competitor.' }
  ];
  var CT = [
    { id: 'C01', name: 'Phishing-resistant MFA (passkeys) for all staff', cost: 140, r: { S1: .35, S2: .30, S5: .10 }, note: 'Replaces SMS and push codes with FIDO2 passkeys on every workforce account.' },
    { id: 'C02', name: 'Immutable offline backups with quarterly restore tests', cost: 110, r: { S1: .50 }, note: 'Cuts ransomware impact by making recovery possible without paying.' },
    { id: 'C03', name: 'EDR with 24x7 managed detection and response', cost: 260, r: { S1: .45, S5: .15 }, note: 'Outsourced around-the-clock monitoring and containment on endpoints and servers.' },
    { id: 'C04', name: 'Payment callback verification and dual approval', cost: 25, r: { S2: .60 }, note: 'A process control: any change to payee bank details is confirmed by a call to a number on file, and payments over $25,000 need two approvers.' },
    { id: 'C05', name: 'Cloud security posture management (CSPM)', cost: 120, r: { S3: .55 }, dep: 'C11', note: 'Continuous scanning of cloud accounts for public exposure and risky permissions.' },
    { id: 'C06', name: 'Third-party risk program with continuous monitoring', cost: 90, r: { S4: .50 }, note: 'Tiering, due diligence, contract clauses, and an external rating feed for critical vendors.' },
    { id: 'C07', name: 'Data loss prevention for email and SaaS', cost: 150, r: { S5: .35, S3: .05 }, note: 'Content inspection and blocking on email, file sharing, and the CRM.' },
    { id: 'C08', name: 'AI-driven autonomous SOC platform', cost: 380, r: { S1: .30, S2: .10, S3: .10, S5: .10 }, conf: 0.4, ai: true, note: 'A 2026 platform that triages and responds with AI agents. Reductions are vendor claims with no reference customers in logistics yet.' },
    { id: 'C09', name: 'Awareness program with deepfake and callback drills', cost: 45, r: { S2: .25, S1: .10 }, note: 'Role-based training for finance and dispatch, with simulated voice-clone calls.' },
    { id: 'C10', name: 'Annual independent penetration test and attestation', cost: 70, r: { S3: .05, S4: .05 }, mand: true, note: 'Required by the master services agreement with Crestline’s largest retail customer and by the cyber insurance policy.' },
    { id: 'C11', name: 'Cloud asset inventory and account baseline', cost: 40, r: { S3: .15 }, note: 'Tags every cloud account and resource to an owner and applies a hardened baseline. Required before CSPM can produce usable findings.' },
    { id: 'C12', name: 'Privileged access management (PAM)', cost: 130, r: { S1: .20, S5: .30, S4: .10 }, note: 'Vaulted, time-limited administrator access with session recording.' }
  ];
  var BUDGET = 950;
  var DRAFT = ['C01', 'C03', 'C08', 'C10'];
  function byId(id) { for (var i = 0; i < CT.length; i++) if (CT[i].id === id) return CT[i]; return null; }
  function inh(s) { return s.sle * s.aro; }
  function rate(c, sid, basis) { var r = c.r[sid] || 0; return r * (basis === 'claim' ? 1 : (c.conf || 1)); }
  function live(c, sel) { return sel.indexOf(c.id) >= 0 && (!c.dep || sel.indexOf(c.dep) >= 0); }
  function evalP(sel, basis) {
    var res = {}, tot = 0, inT = 0, cost = 0;
    SC.forEach(function (s) { var f = 1; CT.forEach(function (c) { if (live(c, sel)) f *= 1 - rate(c, s.id, basis); }); res[s.id] = inh(s) * f; tot += res[s.id]; inT += inh(s); });
    CT.forEach(function (c) { if (sel.indexOf(c.id) >= 0) cost += c.cost; });
    var within = SC.filter(function (s) { return res[s.id] <= s.appetite + 1e-9; }).length;
    return { res: res, tot: tot, inh: inT, cost: cost, avoided: inT - tot, rosi: cost ? (inT - tot - cost) / cost * 100 : 0, within: within };
  }
  function standalone(c, basis) {
    var red = SC.reduce(function (a, s) { return a + inh(s) * rate(c, s.id, basis); }, 0);
    return { red: red, rosi: (red - c.cost) / c.cost * 100 };
  }
  function optimum() {
    var best = null, second = null;
    for (var m = 0; m < (1 << CT.length); m++) {
      var sel = CT.filter(function (c, i) { return m >> i & 1; }).map(function (c) { return c.id; });
      if (CT.some(function (c) { return c.mand && sel.indexOf(c.id) < 0; })) continue;
      if (CT.some(function (c) { return c.dep && sel.indexOf(c.id) >= 0 && sel.indexOf(c.dep) < 0; })) continue;
      var e = evalP(sel, 'evidence');
      if (e.within < SC.length) continue;
      if (!best || e.cost < best.cost) { second = best; best = { sel: sel, cost: e.cost, e: e }; }
      else if (!second || e.cost < second.cost) second = { sel: sel, cost: e.cost, e: e };
    }
    return { best: best, second: second };
  }
  window.B3M = { SC: SC, CT: CT, BUDGET: BUDGET, DRAFT: DRAFT, byId: byId, inh: inh, rate: rate, live: live, evalP: evalP, standalone: standalone, optimum: optimum };
})();
</script>

<script>
(function () {
  var M = window.B3M, OPT = M.optimum();
  function r1(x) { return Math.round(x * 10) / 10; }
  function k(x) { return '$' + (Math.round(x * 10) / 10).toLocaleString('en-US', { maximumFractionDigits: 1 }) + 'k'; }
  function pct(x) { return (x >= 0 ? '' : '−') + Math.abs(Math.round(x)).toLocaleString('en-US') + '%'; }
  var failOpts = ['C12', 'C07', 'C05', 'C06'];
  function failId() { return M.CT.filter(function (c) { return !c.mand && !c.ai && M.standalone(c, 'evidence').rosi < 0; }).map(function (c) { return c.id; }); }

  window.LAB = {
    id: 'B3',
    title: 'Security Budget and Control Portfolio',
    accent: 'Control Portfolio',
    domain: 'Domain 3 (33%)',
    time: '50 min',
    level: 'Intermediate to Advanced',
    lessonHref: 'lesson04.html#s4',
    lessonLabel: 'Lesson 4, Selecting Controls',
    lede: 'Every security program runs on a fixed budget. Fund the controls that bring each risk within appetite at the lowest cost, separate obligations from investments, and defend the portfolio to the risk committee. The best portfolio is rarely the newest tool.',
    workbenchTitle: 'Portfolio optimizer',
    ticket: {
      number: 'FIN-2027-0148',
      priority: 'High priority',
      from: 'Adaeze Okafor, Chief Financial Officer',
      to: 'Security program manager (you)',
      subject: 'FY2027 security investment: portfolio and memo for the Enterprise Risk Committee',
      due: 'Memo to the Risk Committee by November 20',
      body: '<p>The FY2027 security budget for Crestline Parcel Company is fixed at <b>$950,000</b> in annual run cost. That number will not move this year, so the request has to fit inside it.</p>' +
        '<p>The Enterprise Risk Committee approved a risk appetite for five scenarios last quarter, and each scenario has a named executive owner. I need a portfolio that brings every scenario within appetite, at the lowest cost that does so. Any money we do not need goes back to the operations budget.</p>' +
        '<p>Two pressures you should know about. First, our COO, Mateus Ferreira, has seen a demo of an <b>AI-driven autonomous SOC platform</b> and has asked that it be the centerpiece of the program. Our draft portfolio from his office is loaded in the tool. Second, the <b>annual penetration test and attestation</b> is written into our largest customer’s contract and our cyber insurance policy.</p>' +
        '<p>Use the optimizer and its Model tab. Then write the investment memo: what you are funding, why, how you handled the AI platform and the contract obligation, and what residual risk the owners are being asked to accept.</p>'
    },
    howTo: 'The <b>Portfolio optimizer</b> lists twelve candidate controls. Check or uncheck a control and the charts recompute at once: residual loss per scenario against appetite, standalone return on security investment (ROSI) per control, budget used, and portfolio totals. The <b>Model</b> tab states every formula the tool uses, and the checklist uses the same formulas. Use the evidence-weighted basis unless an item says otherwise. A hint is available for every item. After your first check you can reveal the manager’s debrief, but a revealed item earns no points.',
    workIntro: 'All money is in thousands of US dollars per year ($k). Annualized loss expectancy (ALE) is single loss expectancy times annual rate of occurrence. Use the <b>evidence-weighted</b> basis for every checklist answer.',
    checklist: [
      { id: 'inh', type: 'number', points: 10, short: 'Total inherent ALE', title: 'Total inherent ALE across the five scenarios',
        task: 'Before any new control is funded, what is the <b>total annualized loss expectancy</b> across all five risk scenarios? Enter the amount in $k.',
        unit: '$k per year', tol: 1,
        answer: function () { return r1(M.SC.reduce(function (a, s) { return a + M.inh(s); }, 0)); },
        hint: 'Open the Risk scenarios tab. ALE = SLE × ARO for each scenario. Add the five results, or uncheck every control and read the Inherent ALE tile.',
        debrief: '<p>The five scenarios carry $2,415k of expected loss per year, and ransomware alone is half of it at $1,200k. The appetite the committee set adds up to $860k, so the program must remove about $1,555k of expected loss to bring every scenario within appetite.</p><p>Starting from expected loss in business terms is what makes the rest of the conversation possible. The manager can now show the CFO that a $950k budget is being weighed against a $2.4 million annual exposure, and that each owner’s appetite, not the security team’s preference, defines “enough.”</p>',
        reviewNote: 'ALE = SLE × ARO, summed across scenarios.' },
      { id: 'rosi2', type: 'number', points: 10, short: 'ROSI of C02', title: 'Standalone ROSI of immutable backups (C02)',
        task: 'What is the <b>standalone ROSI</b> of C02, immutable offline backups with quarterly restore tests? Enter a percentage, rounded to one decimal place.',
        unit: '%', tol: 1,
        answer: function () { return r1(M.standalone(M.byId('C02'), 'evidence').rosi); },
        hint: 'Standalone ROSI = (annual loss reduction − annual cost) ÷ annual cost. C02 reduces ransomware ALE by 50 percent. The ROSI chart and the Model tab show the formula.',
        debrief: '<p>C02 removes half of the $1,200k ransomware ALE, a $600k reduction for $110k a year, so its standalone ROSI is about 445 percent. It is one of the strongest investments in the catalog because it attacks the largest scenario and lowers impact directly: Crestline can restore instead of paying.</p><p>Note that standalone ROSI overstates what a control adds once others are funded, because reductions overlap. The manager should use standalone ROSI to rank candidates and the portfolio view to decide, which is why the optimizer multiplies residual factors rather than adding savings.</p>',
        reviewNote: 'ROSI = (loss reduction − cost) ÷ cost.' },
      { id: 'rosiai', type: 'number', points: 10, short: 'ROSI of the AI platform', title: 'Evidence-weighted ROSI of the AI SOC platform (C08)',
        task: 'Using the <b>evidence-weighted</b> basis, what is the standalone ROSI of C08, the AI-driven autonomous SOC platform? Enter a percentage, rounded to one decimal place (negative if it loses money).',
        unit: '%', tol: 1,
        answer: function () { return r1(M.standalone(M.byId('C08'), 'evidence').rosi); },
        hint: 'The Model tab explains the evidence weight. Multiply each claimed reduction by the 0.4 confidence factor, apply it to the scenario ALEs, then compare the total with the $380k cost. Switch the basis to Vendor claim to see the difference.',
        debrief: '<p>On the vendor’s claims the platform would remove $459k of loss a year for $380k, a ROSI of about 21 percent. With no reference customers in logistics, the model weights those claims at 40 percent confidence, which leaves about $184k of reduction and a ROSI of about −52 percent. The case for the platform depends entirely on claims nobody has verified.</p><p>The manager does not reject new technology on principle, and does not buy it on a demo. The question is whether the benefit is proven for this organization’s risks. Until it is, the platform is a hypothesis to test, not a control to fund at full scale.</p>',
        reviewNote: 'Weight unproven benefit claims by the confidence the evidence supports.' },
      { id: 'failcb', type: 'choice', points: 10, short: 'Fails cost-benefit', title: 'Which other control fails cost-benefit?',
        task: 'Apart from the AI platform and the mandatory test, which discretionary control returns <b>less in reduced loss than it costs</b> each year?',
        options: failOpts.map(function (id) { return id + ' ' + M.byId(id).name; }),
        answer: function () { return failOpts.indexOf(failId()[0]); },
        hint: 'Read the ROSI chart. Look for a bar to the left of zero that is not C08 or C10.',
        debrief: '<p>Data loss prevention costs $150k a year and removes about $90k of expected loss: 35 percent of the $200k insider-theft ALE plus a sliver of cloud exposure. Its ROSI is about −40 percent. PAM addresses the same insider scenario and also ransomware and third-party access, for less money, and it brings insider theft within appetite together with MFA.</p><p>A control can be good practice and still be a poor investment for a given risk profile. The manager funds controls that trace to a risk objective and return more than they cost. If a business owner still wants DLP for other reasons, such as a customer requirement, that need should be stated and justified on its own terms.</p>',
        reviewNote: 'Compare annual loss reduced with annual cost for each control.' },
      { id: 'mand', type: 'choice', points: 10, short: 'Mandatory control', title: 'Handle the contract-mandated control (C10)',
        task: 'C10, the annual penetration test and attestation, has a negative ROSI in the model. It is required by the largest customer’s contract and by the cyber insurance policy. What should the manager do?',
        options: [
          'Drop it, because its ROSI is negative and the money reduces more loss when it is spent elsewhere',
          'Fund it only if a cheaper control can be cut, so that the portfolio ROSI stays above 100 percent',
          'Ask the customer to waive the clause, and log the obligation as an accepted risk until renewal',
          'Fund it as a non-discretionary obligation outside the ROSI ranking, at the lowest compliant cost'
        ],
        answer: 3,
        hint: 'Is this decision about risk reduction, or about an obligation the organization has already agreed to? Who could accept the consequence of breaching a contract?',
        debrief: '<p>The model shows C10 removing only about $31k of expected loss for $70k. That number is beside the point. Dropping the test would breach the master services agreement and could void insurance coverage, and those consequences are not in the five scenarios at all.</p><p>The manager separates obligations from investments: legal, regulatory, and contractual requirements are funded first, as a fixed cost of doing business, and the discretionary budget is optimized around them. The manager can still look for the least costly way to comply, such as scoping the test to what the contract requires, but cannot trade compliance for ROSI.</p>',
        reviewNote: 'Contractual and regulatory obligations are funded first, outside the ROSI ranking.' },
      { id: 'opt', type: 'set', points: 15, short: 'Lowest-cost portfolio', title: 'The lowest-cost portfolio that meets appetite',
        task: 'Find the portfolio that brings <b>every scenario within appetite</b> at the <b>lowest annual cost</b>. It must include the mandatory control, and any control you fund must have its dependency funded too. Enter the control IDs.',
        label: 'Control IDs', placeholder: 'e.g., C01, C04',
        answer: function () { return OPT.best.sel.slice(); },
        hint: 'Start with every control checked, then remove the most expensive controls one at a time and watch the appetite chart. A control that is not needed for any scenario to stay within appetite is a candidate to drop. Check the CSPM dependency.',
        debrief: '<p>The lowest-cost portfolio is nine controls for $770k a year: passkey MFA, immutable backups, payment callback and dual approval, CSPM with its cloud asset baseline, the third-party program, awareness drills, PAM, and the mandatory test. Every scenario lands within appetite, total residual ALE falls from $2,415k to about $730k, and $180k of the budget is returned. The next-cheapest portfolio that meets appetite costs $890k.</p><p>The surprise is what is left out. Managed detection and response is a strong control, but MFA, backups, and PAM already bring ransomware within appetite, so its marginal value does not justify $260k. The AI platform and DLP are out on cost-benefit. The COO’s draft spends $850k and still leaves all five scenarios above appetite, because it concentrates on detection tools and ignores fraud, cloud, and third-party exposure.</p>',
        reviewNote: 'Optimize to appetite: fund the cheapest set that brings every scenario within it.' },
      { id: 'resid', type: 'number', points: 10, short: 'Residual ALE', title: 'Residual ALE of your recommended portfolio',
        task: 'For the lowest-cost portfolio that meets appetite, what is the <b>total residual ALE</b> across the five scenarios? Enter the amount in $k, to one decimal place.',
        unit: '$k per year', tol: 2,
        answer: function () { return r1(OPT.best.e.tot); },
        hint: 'Load your portfolio in the optimizer and read the Residual ALE tile, which uses the evidence-weighted basis. The value is the sum of the five residual bars.',
        debrief: '<p>The recommended portfolio leaves about $730k of expected loss per year, spread across the five scenarios and each one below its owner’s appetite. The portfolio removes about $1,685k of expected loss for $770k, a portfolio ROSI of roughly 119 percent.</p><p>Residual risk is not zero, and the memo must say so. Each owner accepts the remaining exposure for their scenario. The manager recommends and reports; the business owners, through the risk committee, accept.</p>',
        reviewNote: 'Residual ALE = inherent ALE × the product of (1 − reduction) for funded controls.' },
      { id: 'ai', type: 'choice', points: 10, short: 'AI platform decision', title: 'Respond to the COO’s request for the AI platform',
        task: 'The COO wants the AI-driven SOC platform funded as the centerpiece of the FY2027 program. What should the manager recommend?',
        options: [
          'Propose a time-boxed pilot with agreed success measures, and fund the full contract only if the pilot proves the benefit',
          'Buy it now at full scope, since AI tooling is where the industry is heading and early adopters gain the most from it',
          'Buy it in place of MFA and backups, since its claims cover ransomware and payment fraud with a single platform',
          'Reject it permanently, since a tool without a loss history in our sector can never be justified to the board'
        ],
        answer: 0,
        hint: 'The benefit is unproven, not disproven. What would give the committee evidence without spending $380k on a hypothesis?',
        debrief: '<p>Funding the platform at full scope would consume 40 percent of the budget for a benefit the evidence does not support, and replacing proven controls with it would leave ransomware and fraud above appetite. Rejecting it forever is also wrong: AI-driven operations may well pay off, and the manager should find out.</p><p>The management answer is a structured pilot: a defined scope, a fixed cost and duration, success measures agreed in advance (for example, time to triage or containment on real alerts), and a decision gate. The manager reports the result to the COO and the committee, so the decision is made on evidence and the executive sponsor stays engaged.</p>',
        reviewNote: 'Unproven benefit calls for a time-boxed pilot with success criteria and a decision gate.' },
      { id: 'memo', type: 'text', points: 15, short: 'Investment memo', title: 'Write the investment memo for the risk committee', reportTitle: 'Investment memo',
        task: 'Write a short investment memo to the Enterprise Risk Committee. Use the numbers from your optimizer.',
        fields: [
          { key: 'request', label: 'Funding request: what you are funding and the total cost', min: 40, placeholder: 'The controls, the annual cost, and what is returned from the budget.' },

    found.sort(function (a, b) { return a.cost - b.cost; });
    var b = found[0];
    if (b.ids.join() !== key.opt.slice().sort().join()) P.push('optimum ' + b.ids.join(' ') + ' vs key ' + key.opt.join(' '));
    if (found[1] && found[1].cost === b.cost) P.push('optimum not unique');
    if (b.cost > M.BUDGET) P.push('optimum over budget');
    if (Math.abs(b.tot - key.resid) > 0.2) P.push('residual ' + b.tot + ' vs ' + key.resid);
    log.push('optimum $' + b.cost + 'k ' + b.ids.join(' ') + ' residual ' + b.tot.toFixed(1) + '; next $' + found[1].cost + 'k; acceptable portfolios ' + found.length);
    var d = M.evalP(M.DRAFT, 'evidence'); log.push('COO draft $' + d.cost + 'k within ' + d.within + '/5');
    if (d.within === SC.length) P.push('COO draft should fail appetite');
    if (b.ids.indexOf('C08') >= 0 || b.ids.indexOf('C07') >= 0) P.push('optimum includes a failing control');
    return { log: log, problems: P };
  };
})();
</script>
