<style>
/* ===== Lab B6: ransomware incident command tabletop (scoped b6-) ===== */
.b6-modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; margin: 0 0 1rem; }
.b6-mode { text-align: left; border: 1px solid var(--border); background: var(--card-bg); border-radius: 4px; padding: .7rem .85rem; cursor: pointer; font: .82rem/1.45 Arial, sans-serif; color: var(--text-secondary); }
.b6-mode b { display: block; font: 700 .95rem Georgia, serif; color: var(--text-primary); margin-bottom: .15rem; }
.b6-mode:hover { border-color: var(--gold); }
.b6-mode[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); background: var(--blue-pale); }
.b6-mode[aria-pressed="true"] b::after { content: " (selected)"; font: 700 .7rem Arial, sans-serif; color: var(--navy); letter-spacing: .04em; }
.b6-mode:focus-visible, .b6-btnrow .btn:focus-visible, .b6-seg button:focus-visible, .b6-opt:focus-within, .b6-wi button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.b6-bar { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; padding: .75rem .9rem; border: 1px solid var(--blue-pale-border); background: var(--blue-pale); border-radius: 4px; margin-bottom: 1rem; font: .88rem Arial, sans-serif; color: var(--text-secondary); }
.b6-bar .b6-simclk { font: 900 1.4rem 'Arial Narrow', Arial, sans-serif; color: var(--navy); letter-spacing: .02em; }
.b6-btnrow { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.b6-seg { display: inline-flex; gap: .3rem; flex-wrap: wrap; }
.b6-seg button { border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary); border-radius: 4px; padding: .45rem .8rem; font: 700 .82rem Arial, sans-serif; cursor: pointer; }
.b6-seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
.b6-lbl { display: block; font: 700 .7rem Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }

/* Facilitator / team board (projector) */
.b6-board { border: 2px solid var(--navy); border-radius: 6px; background: #fff; padding: 1.1rem 1.3rem 1.2rem; margin-bottom: 1.1rem; }
.b6-b-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 1rem 1.6rem; align-items: start; padding-bottom: .9rem; border-bottom: 1px solid var(--border); }
.b6-code { display: block; font: 700 3.4rem/1.05 'Courier New', monospace; letter-spacing: .08em; color: var(--navy); margin: .2rem 0 .3rem; }
.b6-codenote { display: block; font: 700 .9rem/1.45 Arial, sans-serif; color: var(--navy); background: var(--gold-pale); border: 1px solid var(--gold); border-left-width: 5px; border-radius: 3px; padding: .35rem .6rem; }
.b6-codenote.calm { color: var(--text-secondary); background: var(--blue-pale); border-color: var(--blue-pale-border); border-left-width: 1px; }
.b6-clock { display: block; font: 900 3.2rem/1.05 'Arial Narrow', Arial, sans-serif; color: var(--text-primary); margin: .2rem 0 .25rem; }
.b6-clock-sub { display: block; font: 700 1.05rem/1.4 Arial, sans-serif; color: var(--text-secondary); }
.b6-state { display: inline-block; font: 700 .78rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; border-radius: 3px; padding: .15rem .5rem; margin-left: .4rem; vertical-align: middle; border: 1px solid var(--navy); color: var(--navy); }
.b6-state.paused { border-color: var(--amber); color: #7a4a00; background: #fff5e0; }
.b6-cur { padding: 1rem 0 .4rem; }
.b6-cur .b6-cur-meta { font: 700 1rem Arial, sans-serif; color: var(--navy-light); letter-spacing: .04em; }
.b6-cur h3 { font: 700 1.9rem/1.2 Georgia, serif; color: var(--text-primary); margin: .25rem 0 .5rem; }
.b6-cur p { font: 1.15rem/1.55 Arial, sans-serif; color: var(--text-secondary); margin: 0 0 .6rem; max-width: 72ch; }
.b6-cur ol.b6-cur-opts { list-style: none; margin: .4rem 0 .5rem; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .5rem .9rem; }
.b6-cur ol.b6-cur-opts li { font: 1.08rem/1.45 Arial, sans-serif; color: var(--text-primary); border: 1px solid var(--blue-pale-border); background: var(--blue-pale); border-radius: 4px; padding: .5rem .7rem; }
.b6-cur ol.b6-cur-opts li b { font: 900 1.2rem 'Arial Narrow', Arial, sans-serif; color: var(--navy); margin-right: .35rem; }
.b6-cur .b6-ask { font: 700 1.1rem Georgia, serif; color: var(--navy); margin: .3rem 0 .2rem; }
.b6-board .b6-btnrow { padding-top: .8rem; border-top: 1px solid var(--border); }
.b6-board.team .b6-code { font-size: 1.6rem; }
.b6-board.team .b6-clock { font-size: 2.2rem; }
.b6-board.team .b6-cur h3 { font-size: 1.4rem; }
.b6-board.team .b6-cur p { font-size: .98rem; }
.b6-prev { font: .8rem Arial, sans-serif; color: var(--text-muted); margin: .4rem 0 0; }
.b6-join { display: flex; flex-wrap: wrap; gap: .6rem; align-items: flex-end; margin-bottom: .8rem; }
.b6-join label { display: block; font: 700 .9rem Georgia, serif; color: var(--text-primary); margin-bottom: .3rem; }
.b6-join input { font: 700 1.3rem 'Courier New', monospace; letter-spacing: .1em; text-transform: uppercase; width: 11rem; padding: .45rem .6rem; border: 1px solid var(--border); border-radius: 4px; color: var(--text-primary); }
.b6-join input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px var(--gold-pale); }
.b6-err { font: 700 .88rem Arial, sans-serif; color: var(--wrong); margin: 0 0 .8rem; }
.b6-warn { font: .88rem Arial, sans-serif; color: var(--text-primary); background: #fff5e0; border-left: 4px solid var(--amber); padding: .5rem .7rem; margin: 0 0 .8rem; }
.b6-board:fullscreen { box-sizing: border-box; width: 100vw; height: 100vh; border: 0; border-radius: 0; padding: 3.5vh 4vw; display: flex; flex-direction: column; overflow: hidden; }
.b6-board:fullscreen .b6-code { font-size: min(9vh, 6vw); }
.b6-board:fullscreen .b6-clock { font-size: min(9vh, 6vw); }
.b6-board:fullscreen .b6-clock-sub, .b6-board:fullscreen .b6-codenote { font-size: min(2.5vh, 1.6vw); }
.b6-board:fullscreen .b6-cur { flex: 1; min-height: 0; overflow: hidden; }
.b6-board:fullscreen .b6-cur h3 { font-size: min(4.6vh, 3vw); }
.b6-board:fullscreen .b6-cur p { font-size: min(2.6vh, 1.7vw); max-width: none; }
.b6-board:fullscreen .b6-cur ol.b6-cur-opts li { font-size: min(2.5vh, 1.6vw); }
.b6-board:fullscreen .b6-cur .b6-cur-meta, .b6-board:fullscreen .b6-cur .b6-ask { font-size: min(2.5vh, 1.6vw); }

/* Impact clock */
.b6-ic { border: 1px solid var(--border); border-radius: 4px; padding: .9rem 1rem 1rem; margin-bottom: 1.1rem; background: var(--card-bg); }
.b6-ic h4 { font: 700 1rem Georgia, serif; color: var(--text-primary); margin: 0 0 .2rem; }
.b6-ic .b6-ic-sum { font: .86rem/1.55 Arial, sans-serif; color: var(--text-secondary); margin: .1rem 0 .7rem; }
.b6-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .6rem; margin-bottom: .8rem; }
.b6-tile { border: 1px solid var(--blue-pale-border); background: var(--blue-pale); border-radius: 4px; padding: .55rem .7rem .6rem; }
.b6-tile .v { display: block; font: 900 1.75rem/1.1 'Arial Narrow', Arial, sans-serif; color: var(--navy); }
.b6-tile .u { font: 700 .8rem Arial, sans-serif; color: var(--text-secondary); margin-left: .2rem; }
.b6-tile .dl { display: block; font: 700 .74rem Arial, sans-serif; color: var(--text-muted); margin-top: .15rem; min-height: 1em; }
.b6-tile .dl.up { color: var(--wrong); } .b6-tile .dl.good { color: var(--correct); }
.b6-meter { height: 8px; background: #fff; border: 1px solid var(--blue-pale-border); border-radius: 4px; overflow: hidden; margin-top: .35rem; }
.b6-meter i { display: block; height: 100%; background: var(--navy-light); }
.b6-chart { width: 100%; height: auto; display: block; }
.b6-chart text { font: 11px Arial, sans-serif; fill: #52606b; }
.b6-chart .ax { stroke: #c9d6da; stroke-width: 1; }
.b6-chart .grid { stroke: #e4eef0; stroke-width: 1; }
.b6-chart .ln { fill: none; stroke: #0f3b4c; stroke-width: 2.5; }
.b6-chart .ln2 { fill: none; stroke: #0d8a7c; stroke-width: 2.5; stroke-dasharray: 7 5; }
.b6-chart .pt { fill: #0f3b4c; } .b6-chart .pt2 { fill: #fff; stroke: #0d8a7c; stroke-width: 2; }
.b6-chart .lbl { font-weight: 700; fill: #0f3b4c; } .b6-chart .lbl2 { font-weight: 700; fill: #0b6f64; }
.b6-legend { font: .78rem Arial, sans-serif; color: var(--text-secondary); margin: .2rem 0 .4rem; display: flex; gap: 1.2rem; flex-wrap: wrap; }
.b6-legend span::before { content: ""; display: inline-block; width: 26px; height: 0; border-top: 3px solid #0f3b4c; vertical-align: middle; margin-right: .35rem; }
.b6-legend span.wi::before { border-top: 3px dashed #0d8a7c; }

/* Inject feed and decisions */
.b6-feed { display: grid; gap: .8rem; }
.b6-inj { border: 1px solid var(--border); border-left: 4px solid var(--navy); border-radius: 0 4px 4px 0; padding: .8rem 1rem .9rem; background: var(--card-bg); }
.b6-inj.newest { border-left-color: var(--gold); }
.b6-inj-h { font: 700 .74rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
.b6-inj h5 { font: 700 1.02rem Georgia, serif; color: var(--text-primary); margin: .2rem 0 .4rem; }
.b6-inj p { font: .88rem/1.6 Arial, sans-serif; color: var(--text-secondary); margin: 0 0 .5rem; }
.b6-inj p b { color: var(--text-primary); }
.b6-dec { border-top: 1px dashed var(--border); padding-top: .6rem; margin-top: .3rem; }
.b6-dec fieldset { border: 0; margin: 0; padding: 0; }
.b6-dec legend { font: 700 .72rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: .35rem; }
.b6-opt { display: flex; gap: .5rem; align-items: flex-start; border: 1px solid var(--border); border-radius: 4px; padding: .45rem .6rem; margin-bottom: .35rem; font: .86rem/1.45 Arial, sans-serif; color: var(--text-primary); cursor: pointer; background: #fff; }
.b6-opt:hover { border-color: var(--gold); }
.b6-opt input { margin-top: .2rem; }
.b6-opt b { color: var(--navy); }
.b6-opt.mine { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); background: var(--blue-pale); cursor: default; }
.b6-opt.dim { opacity: .62; cursor: default; }
.b6-tag { font: 700 .66rem Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: .05rem .35rem; border: 1px solid var(--navy); color: var(--navy); white-space: nowrap; background: #fff; }
.b6-res { border-left: 4px solid var(--navy-light); background: var(--blue-pale); padding: .55rem .75rem; margin-top: .5rem; font: .86rem/1.55 Arial, sans-serif; color: var(--text-primary); }
.b6-res .fx { display: block; font: 700 .78rem Arial, sans-serif; color: var(--text-secondary); margin-top: .3rem; }
.b6-empty { font: .9rem Arial, sans-serif; color: var(--text-muted); border: 1px dashed var(--border); border-radius: 4px; padding: 1rem; text-align: center; }
.b6-pending { font: .82rem Arial, sans-serif; color: var(--text-muted); margin: .3rem 0 0; }
.b6-h4 { font: 700 1.05rem Georgia, serif; color: var(--text-primary); margin: 1.2rem 0 .6rem; }

/* What-if replay */
.b6-wi { border: 1px solid var(--border); border-radius: 4px; padding: .9rem 1rem 1rem; margin-top: 1.1rem; background: var(--card-bg); }
.b6-wi-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .4rem 1rem; align-items: center; padding: .35rem 0; border-bottom: 1px solid var(--section-alt); font: .85rem Arial, sans-serif; color: var(--text-primary); }
.b6-wi-row .b6-seg button { min-width: 2.6rem; }
.b6-wi-row .b6-seg button.yours { border-style: dashed; border-color: var(--navy); }
.b6-wi table.data td.num, .b6-wi table.data th.num { text-align: right; }
@media (max-width: 760px) {
  .b6-modes { grid-template-columns: 1fr; }
  .b6-b-top { grid-template-columns: 1fr; }
  .b6-code { font-size: 2.4rem; }
  .b6-clock { font-size: 2.4rem; }
  .b6-cur h3 { font-size: 1.35rem; }
  .b6-cur p { font-size: 1rem; }
  .b6-cur ol.b6-cur-opts { grid-template-columns: 1fr; }
  .b6-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .b6-wi-row { grid-template-columns: 1fr; }
}
@media print { .b6-path-wrap { break-inside: avoid; } }
</style>

<body>
<div id="app"><noscript><p style="padding:2rem;font-family:Arial">This lab needs JavaScript enabled.</p></noscript></div>

<script>
/* ===================== Scenario, consequence model, and session-code engine =====================
   Halvard Precision Components: ransomware with data extortion. Eight decision injects.
   Each option carries a deterministic consequence (downtime hours, records exposed in
   thousands, direct cost in $K, reputation points). A few options set flags that change
   the consequence of a later decision. Business interruption is priced per downtime hour. */
(function () {
  var BASE = { h: 1, m: 40 }; // T+0:00 = Saturday 01:40
  var DAYS = ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu'];
  var BI_RATE = 30; // $K of business interruption per downtime hour
  var LETTERS = 'ABCD';
  function o(t, dt, ex, cost, rep, res, flag) { return { t: t, d: { dt: dt, ex: ex, cost: cost, rep: rep }, res: res, flag: flag || null }; }
  var INJECTS = [
    { id: 'I1', t: 0, title: 'Encryption is spreading at Plant 2', refs: 'IMP 3.1', best: 1,
      base: { dt: 24, ex: 38, cost: 250, rep: 0 },
      sit: 'At 01:31 the SOC sees mass file renames on the Plant 2 file servers and the ERP application tier. EDR shows a domain administrator account, svc-backup, logging on to servers across all three plants. Firewall logs show 38 GB sent to an unfamiliar cloud storage host over the last six hours. Plants 1 and 3 are still running.',
      ask: 'What do you direct the response team to do first?',
      opts: [
        o('Shut down every server, workstation, and plant network at all three sites now.', 30, 0, 120, -3, 'The spread stops, but so do Plants 1 and 3, which were clean. Memory on the infected servers is lost when they power off, so the forensics team loses the attacker’s running tools and keys.', 'volatile'),
        o('Isolate affected segments, block outbound traffic, and disable the stolen account.', 8, 0, 40, 0, 'The spread stops at Plant 2 and the ERP tier. Outbound transfer ends. Plants 1 and 3 keep running on local systems under enhanced monitoring, and the infected servers stay powered on for evidence capture.'),
        o('Keep everything running and watch the attacker until the full scope of the attack is known.', 36, 46, 220, -8, 'While the team watches, the attacker encrypts Plant 3 and sends another 46,000 records out. By the time containment starts, two plants are down instead of one.'),
        o('Restore the encrypted file servers from last night’s backup right away.', 22, 18, 140, -4, 'The restored servers are re-encrypted within the hour because the attacker still holds the domain account. The restore also overwrites disk evidence, and more data leaves during the confusion.', 'evidence')
      ] },
    { id: 'I2', t: 70, title: 'Severity and escalation', refs: 'IMP 1.2, 2.1', best: 0,
      base: { dt: 6, ex: 0, cost: 50, rep: 0 },
      sit: 'Containment is under way. ERP order entry and production scheduling are down at Plant 2, and the exfiltration confirms that data left the network. The IMP severity matrix is on the Incident plan tab. It is 02:50 on a Saturday, and the CIO asks whether to wake the CEO.',
      ask: 'How do you classify and escalate?',
      opts: [
        o('Declare Severity 1 and convene the executive crisis team within the hour.', 0, 0, 10, 0, 'The crisis team meets at 03:45 with the CEO in the chair. Business decisions, including plant operations and outside engagements, now have an owner, and you can run the response without waiting for approvals.'),
        o('Hold it at Severity 2 inside IT until scope is confirmed, then brief executives Monday.', 10, 0, 60, -5, 'Without the crisis team, nobody can authorize outside spending or speak for the company. Requests stall until Sunday, when the CEO learns about the incident from a customer.', 'late'),
        o('Brief only the CIO now and let the CIO decide whether the CEO is told.', 4, 0, 30, -2, 'The CIO waits until 08:00 to call the CEO. Legal and communications join late, and the escalation path in the IMP is bypassed.', 'late'),
        o('Ask the board chair to take personal command of the technical response.', 6, 0, 40, -3, 'The board chair is willing but is not an incident leader. Technical calls go through a director with no context, and the crisis team that owns business decisions never forms.')
      ] },
    { id: 'I3', t: 200, title: 'Who to call: counsel, insurer, or forensics', refs: 'IMP 3.2', best: 3,
      base: { dt: 6, ex: 0, cost: 200, rep: 0 },
      sit: 'The crisis team approves outside help. IT wants to call ByteForge Security, a firm it used last year. The cyber policy with Granite Shield Mutual requires notice within 48 hours and reimburses only panel vendors or vendors it approves in writing. The General Counsel recommends Whitcombe and Arrul LLP as breach counsel.',
      ask: 'In what order do you bring in outside parties?',
      opts: [
        o('Hire ByteForge directly right now, and tell the insurer once the facts are clear.', -2, 0, 420, 0, 'ByteForge starts two hours sooner. Granite Shield later declines to reimburse its fees because it was not a panel vendor and was not approved in writing, and its reports are not protected by legal privilege.'),
        o('Wait for the insurer to assign every vendor before engaging anyone at all.', 10, 0, 60, -2, 'The insurer’s claims desk is slow on a weekend. Ten hours pass before a forensics team is assigned, and counsel is not engaged in that time.'),
        o('Run the forensics with internal IT staff to save money and keep things quiet.', 14, 20, 80, -3, 'The internal team is skilled at operations but not at forensics. It misses a persistence mechanism on two domain controllers, and more data leaves before the gap is found.', 'weak'),
        o('Notify the insurer, and have breach counsel retain the panel forensics firm.', 0, 0, 70, 0, 'Counsel retains Northlight DFIR from the insurer’s panel under a privileged engagement by 07:30. Fees are covered under the policy, and findings flow to counsel and the crisis team.')
      ] },
    { id: 'I4', t: 500, title: 'Rebuild now or preserve evidence first', refs: 'IMP 4.1', best: 1,
      base: { dt: 8, ex: 0, cost: 200, rep: 0 },
      sit: 'Gold images for the ERP servers are ready. The COO, Marcus Lindqvist, wants the servers wiped and rebuilt now so Plant 2 can run Monday shifts. Northlight DFIR needs about six hours to image disks and memory on the in-scope systems to establish what data was taken.',
      ask: 'What do you recommend to the crisis team?',
      opts: [
        o('Rebuild the servers from gold images now and skip forensic imaging.', -4, 0, 260, -4, 'Plant 2 restarts four hours sooner. Without images, Northlight cannot show what was taken, and the insurer questions the claim.', 'evidence'),
        o('Image in-scope disks and memory first, and rebuild in a clean enclave.', 3, 0, 90, 0, 'Evidence is captured with chain of custody, and the rebuild proceeds in parallel in a clean network enclave. The delay is three hours, and the scope of exposure can be proven.'),
        o('Preserve every system in the company in full before any rebuild begins.', 28, 0, 170, -3, 'Imaging more than 400 systems takes more than a day. Most of them were never touched, and production waits for evidence nobody needs.'),
        o('Clean the encrypted servers in place with antivirus and bring them back up.', 18, 24, 110, -4, 'Antivirus removes the ransomware binary but not the attacker’s access. Two servers are re-encrypted, and the restart slips by most of a day.', 'weakErad')
      ] },
    { id: 'I5', t: 1220, title: 'The leak site names Halvard', refs: 'IMP 5.1', best: 2,
      base: { dt: 4, ex: 14, cost: 60, rep: -8 },
      sit: 'At 21:40 Saturday, a group calling itself VELLUM posts Halvard on its leak site with sample files: customer engineering drawings and an employee tax form export. Northlight confirms the samples match the stolen data. Two aerospace customers and a trade reporter are calling the account teams.',
      ask: 'What do you tell customers, and when?',
      opts: [
        o('Say nothing publicly until the investigation is complete and every fact is final.', 0, 0, 140, -16, 'Customers learn more from the leak site than from Halvard. One aerospace customer suspends new orders, citing silence from its supplier.'),
        o('State publicly that no customer or employee data was taken in the attack.', 0, 0, 320, -24, 'The statement is contradicted by the leak site within a day. Customers and the press treat every later update with suspicion, and counsel warns of claims based on the statement.'),
        o('Issue the approved holding statement and brief key customers from a script.', 0, 0, 40, -3, 'The communications director issues the holding statement at 23:10. Account executives brief the top customers with what is known, what is being done, and when the next update comes. Customers stay engaged.'),
        o('Let plant managers and account reps answer their own customers as they see fit.', 0, 0, 90, -11, 'Customers hear five different versions. One rep speculates about the attacker, and a quote appears in the trade press.')
      ] },
    { id: 'I6', t: 1820, title: 'The extortion demand', refs: 'IMP 5.2', best: 0,
      base: { dt: 4, ex: 0, cost: 40, rep: -2 },
      sit: 'VELLUM emails the CFO: $4.2 million in cryptocurrency within 72 hours, or all 410 GB will be published. It offers a free test decryption. Northlight reports that the immutable backups are clean and that restoration is on track. A board member asks whether paying would end this faster.',
      ask: 'How does Halvard handle the demand?',
      opts: [
        o('Follow the extortion policy: no contact, and counsel and insurer advise the CEO.', 0, 0, 50, 0, 'No employee replies. Counsel, the insurer, and the crisis team review the demand; sanctions screening flags the group as high risk. With clean backups, the CEO and board decline to pay and record the decision.'),
        o('Pay the $4.2 million now to stop the publication and get the decryptor.', -6, 8, 4380, -6, 'The decryptor works slowly and corrupts some files. Two weeks later, part of the data appears on another forum anyway. The payment raised sanctions questions that counsel must now answer.'),
        o('Have the IT director message the attacker to stall the 72-hour deadline for a while.', 0, 12, 260, -5, 'The attacker shares screenshots of the chat and publishes a larger sample to raise pressure. Counsel must now review the staff contact for sanctions and disclosure issues.'),
        o('Refuse publicly and call out the group on social media to show strength.', 0, 30, 90, -7, 'VELLUM responds by publishing the full data set early. The post draws more press attention to Halvard than to the attacker.')
      ] },
    { id: 'I7', t: 2180, title: 'Law enforcement and notifications', refs: 'IMP 5.3, Appendix N', best: 3,
      base: { dt: 2, ex: 0, cost: 40, rep: 0 },
      sit: 'Northlight confirms that customer drawings for 11 accounts and records for about 1,900 current and former employees were taken. Halvard’s notification matrix (Appendix N) lists obligations to law enforcement, customer contracts, the insurer, and employees, with internal deadlines. Some executives worry that a law enforcement report will make the incident public.',
      ask: 'What do you recommend on reporting and notification?',
      opts: [
        o('Stay away from law enforcement so the incident does not become more public.', 0, 0, 200, -8, 'Halvard loses access to threat intelligence on VELLUM, and the insurer and two customers ask why no report was made. Later notices look reluctant.'),

      ] },
    { id: 'I8', t: 4340, title: 'When to declare recovery', refs: 'IMP 4.2', best: 2,
      base: { dt: 6, ex: 0, cost: 60, rep: 0 },
      sit: 'It is 02:00 Tuesday. ERP and production scheduling are back at Plants 1 and 2. Northlight has removed the persistence it found, but validation at Plant 3 is not finished, and 80 percent of credentials have been reset. The COO wants recovery declared and the incident closed so overtime can end.',

  ];
  var SIM_END = 4820;

  /* Consequence of committing option c at inject k, given the other committed decisions */
  function effect(k, c, dec) {
    var op = INJECTS[k].opts[c], d = { dt: op.d.dt, ex: op.d.ex, cost: op.d.cost, rep: op.d.rep }, notes = [];
    function has(f) { for (var j = 0; j < k; j++) if (dec[j] != null && INJECTS[j].opts[dec[j]].flag === f) return true; return false; }
    if (k === 3) {
      if (has('volatile')) { d.cost += 60; notes.push('Memory lost in the shutdown at Inject 1 adds forensic work: +$60K.'); }
      if (has('evidence') || op.flag === 'evidence') { d.ex += 60; d.cost += 180; notes.push('Evidence was destroyed, so the exposure cannot be narrowed and every share counts as exposed: +60,000 records and +$180K in broader notification.'); }
    }
    if (k === 4 && has('late')) { d.rep -= 4; notes.push('The late escalation at Inject 2 left communications behind the story: 4 more reputation points.'); }

    }
    return { d: d, notes: notes };
  }
  /* Totals after `count` injects released with decisions `dec` (array of option index or null) */
  function model(dec, count) {
    var n = count == null ? 8 : count, T = { dt: 0, ex: 0, cost: 0, rep: 100 }, steps = [], decided = 0;
    for (var k = 0; k < n; k++) {
      var b = INJECTS[k].base; T.dt += b.dt; T.ex += b.ex; T.cost += b.cost; T.rep += b.rep;
      if (dec[k] != null) { var e = effect(k, dec[k], dec).d; T.dt += e.dt; T.ex += e.ex; T.cost += e.cost; T.rep += e.rep; decided++; }
      steps.push({ dt: T.dt, ex: T.ex, cost: T.cost, total: T.cost + BI_RATE * T.dt, rep: T.rep, decided: dec[k] != null });
    }
    return { dt: T.dt, ex: T.ex, cost: T.cost, total: T.cost + BI_RATE * T.dt, rep: Math.max(0, T.rep), steps: steps, decided: decided };
  }
  var BEST = INJECTS.map(function (x) { return x.best; });

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function hm(min) { min = Math.max(0, Math.floor(min)); return Math.floor(min / 60) + ':' + pad(min % 60); }
  function tplus(min) { return 'T+' + hm(min); }
  function wall(min) { var tot = BASE.h * 60 + BASE.m + Math.floor(min), d = Math.floor(tot / 1440), r = tot % 1440; return DAYS[Math.min(d, DAYS.length - 1)] + ' ' + pad(Math.floor(r / 60)) + ':' + pad(r % 60); }
  function money(k) { return '$' + (k / 1000).toFixed(2) + 'M'; }

  /* ---------- Session code (same design as CISA B5, own lab tag) ----------
     30 payload bits in 6 Crockford base32 characters + 1 checksum character.
     tag(2) | interval(2) | paused(1) | inject index(3) | anchor(22).

  function encode(st) {
    var a = ((Math.floor(st.anchor) % M) + M) % M;
    var v = (((TAG * 4 + st.iv) * 2 + (st.paused ? 1 : 0)) * 8 + st.b) * M + a, ch = [];
    for (var i = 5; i >= 0; i--) { ch[i] = v % 32; v = Math.floor(v / 32); }
    ch.push(checksum(ch));
    return ch.map(function (c) { return ALPHA[c]; }).join('');
  }
  function fmtCode(c) { return c.slice(0, 3) + '-' + c.slice(3); }
  function clean(s) { return String(s || '').toUpperCase().replace(/[\s\-_.]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1').replace(/U/g, 'V'); }
  function resolve(a, nowSec) { var c = nowSec - (((nowSec - a) % M) + M) % M; if (nowSec - c > M / 2) c += M; return c; }
  function decode(raw, nowSec) {
    var s = clean(raw);
    if (!s) return { error: 'Enter the session code shown on the projector.' };
    if (s.length !== 7) return { error: 'Session codes have 7 characters, such as K7Q-4MZP. You entered ' + s.length + '.' };
    var vals = [];
    for (var i = 0; i < 7; i++) { var k = ALPHA.indexOf(s[i]); if (k < 0) return { error: 'The code contains a character that session codes do not use: ' + s[i] + '.' }; vals.push(k); }
    if (checksum(vals.slice(0, 6)) !== vals[6]) return { error: 'That code does not check out. One character is probably mistyped. Compare it with the projector and try again.' };
    var v = 0; for (i = 0; i < 6; i++) v = v * 32 + vals[i];
    var a = v % M, r = Math.floor(v / M), b = r % 8; r = Math.floor(r / 8); var p = r % 2; r = Math.floor(r / 2); var iv = r % 4, tag = Math.floor(r / 4);
    if (tag !== TAG || iv > 2) return { error: 'That is not a session code for this lab. Ask the facilitator for the B6 code.' };
    var st = { code: s, b: b, paused: !!p, iv: iv };

  }

    else {

    return { idx: idx, count: idx + 1, within: within, nextIn: nextIn, sim: sim, closed: idx === 7 && within >= I, I: I };
  }

  window.B6 = {
    INJECTS: INJECTS, BEST: BEST, BI_RATE: BI_RATE, LETTERS: LETTERS, IVS: IVS, ALPHA: ALPHA, M: M, TAG: TAG,
    hm: hm, tplus: tplus, wall: wall, money: money, effect: effect, model: model,
    encode: encode, decode: decode, derive: derive, fmtCode: fmtCode, clean: clean, checksum: checksum,
    answers: {
      bestDowntime: function () { return model(BEST, 8).dt; },
      bestCostM: function () { return Math.round(model(BEST, 8).total) / 1000; }
    }
  };
})();
</script>

<script>
(function () {
  var B = window.B6, API = null, CUR = null;

  function allDecided() { return decs().every(function (v) { return v != null; }); }
  function lockDecision(k) { return function () { return decs()[k - 1] != null ? false : 'Unlocks after you commit your decision at Inject ' + k + ' on the Exercise tab.'; }; }

  }
  function mmss(s) { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }

  function keepFocus(fn) {
    var a = document.activeElement, id = a && a.id, s1, s2;
    try { s1 = a.selectionStart; s2 = a.selectionEnd; } catch (e) { }

    if (id) { var el = document.getElementById(id); if (el && el !== document.activeElement) { el.focus({ preventScroll: true }); try { if (s1 != null) el.setSelectionRange(s1, s2); } catch (e) { } } }
  }

  /* ---------- Facilitator actions: every schedule change issues a new code ---------- */
  function facCode(f, reason) {

      '<h5 id="b6h-' + x.id + '">' + x.id + '. ' + esc(x.title) + '</h5>' +

    var D = decs(), out = [];

  }

  function chartSVG(lines, n) {
    // lines: [{steps, cls, pt, lbl}] cumulative total cost ($K) after each inject
    var W = 640, H = 190, l = 52, r = 16, t = 14, b = 30, max = 1000;
    lines.forEach(function (ln) { ln.steps.forEach(function (s) { max = Math.max(max, s.total); }); });
    max = Math.ceil(max / 1000) * 1000;
    function X(i) { return l + (W - l - r) * i / 7; }

  }
  function tile(label, val, unit, delta, goodDown, meter) {

  }
  function icHTML(L) {
    var D = decs(), m = B.model(D, L.count), last = CUR.lastDec, ld = null;
    if (last != null && D[last] != null && last < L.count) ld = B.effect(last, D[last], D).d;

        tile('Total cost', B.money(m.total), '', ld ? sgn((ld.cost + B.BI_RATE * ld.dt) / 1000, 'M', 2).replace(/^([+\u2212\u00b1])/, '$1$') : null, true) +
        tile('Reputation', m.rep, ' / 100', ld ? sgn(ld.rep, ' pts') : null, false, m.rep) + '</div>' +
      '<span class="b6-lbl">Total cost after each inject (direct cost plus business interruption)</span>' + chartSVG([{ name: 'Your path', steps: m.steps, cls: 'ln', pt: 'pt', lbl: 'lbl' }], L.count) + '</section>';
  }

  function wiHTML() {
    var D = decs(); if (!D.every(function (v) { return v != null; })) return '';

    var rows = B.INJECTS.map(function (x, k) {

      '<tr><td>Reputation (of 100)</td><td class="num">' + mine.rep + '</td><td class="num"><b>' + alt.rep + '</b></td><td class="num">' + diff(mine.rep, alt.rep) + '</td></tr></tbody></table></div>';
    var same = W.join() === D.join();

      root.addEventListener('input', function (e) { if (e.target.id === 'b6-codein') CUR.draft = e.target.value; });
      root.addEventListener('change', function (e) { var t = e.target; if (t.dataset.dec) { CUR.draft6[t.dataset.dec] = +t.value; } });
      document.addEventListener('fullscreenchange', function () { var fb = document.getElementById('b6-fs'); if (fb) fb.textContent = document.fullscreenElement ? 'Exit full screen' : 'Present full screen'; });
      renderLive(true);
    },
    lockDecision: lockDecision,
    lockAll: lockAll
  };

  /* ---------- Report: add the learner's incident path ---------- */
  function pathHTML() {
    var D = decs(), S = (API || window.LAB_API).state(), m = B.model(D, 8);
    var byInj = {}; LAB.checklist.forEach(function (it) { if (it.inj != null) byInj[it.inj] = it; });
    var rows = B.INJECTS.map(function (x, k) {
      var it = byInj[k], known = it && (S.st[it.id] === 'ok' || S.revealed[it.id]);
      var mine = D[k], e = mine != null ? B.effect(k, mine, D).d : null;
      return '<tr><td>' + x.id + '. ' + esc(x.title) + '</td><td>' + (mine == null ? '<em>Not committed</em>' : B.LETTERS[mine] + '. ' + esc(x.opts[mine].t)) + '</td><td>' + (known ? B.LETTERS[x.best] + (mine === x.best ? ' (matches)' : '') : 'Shown after item ' + (k + 1) + ' is verified') + '</td><td>' + (e ? sgn(e.dt, ' h') + ', ' + sgn(e.rep, ' rep') + ', ' + sgn((e.cost + B.BI_RATE * e.dt) / 1000, 'M', 2).replace(/^([+\u2212\u00b1])/, '$1$') : '') + '</td></tr>';
    }).join('');
    return '<div class="b6-path-wrap" id="b6-path"><h3>Your incident command path</h3><div class="table-wrap"><table class="data"><thead><tr><th>Inject</th><th>Your committed decision</th><th>IMP-supported decision</th><th>Decision impact (downtime, reputation, total cost)</th></tr></thead><tbody>' + rows +
      '<tr class="px-total"><td>Outcome of your path</td><td colspan="3">' + (m.decided === 8 ? 'Downtime ' + m.dt + ' h; exposure ' + m.ex + 'K records; total cost ' + B.money(m.total) + '; reputation ' + m.rep + ' of 100.' : m.decided + ' of 8 decisions committed.') + '</td></tr></tbody></table></div></div>';
  }
  function decorateReport() {
    var rep = document.querySelector('.px-report'); if (!rep || rep.querySelector('#b6-path') || !API) return;
    var hs = rep.querySelectorAll('h3'), anchor = null;
    for (var i = 0; i < hs.length; i++) if (/Answers recorded/.test(hs[i].textContent)) anchor = hs[i];
    if (anchor) anchor.insertAdjacentHTML('beforebegin', pathHTML());
  }
  document.addEventListener('DOMContentLoaded', function () {
    var app = document.getElementById('app');
    if (app) new MutationObserver(decorateReport).observe(app, { childList: true, subtree: true });
  });
  if (!API) { var waitApi = setInterval(function () { if (window.LAB_API) { API = API || window.LAB_API; clearInterval(waitApi); decorateReport(); } }, 200); }

  // Automated test hook: release every inject in Solo mode and commit a path
  window.LAB_TEST_UNLOCK = function () { var a = API || window.LAB_API; if (!a) return; a.note('mode', 'solo'); a.note('solo', 8); a.note('maxSeen', 8); var d = {}; B.INJECTS.forEach(function (x, k) { d[x.id] = (x.best + 1 + (k % 3)) % 4; }); a.note('dec', d); if (CUR) renderLive(true); };

  window.LAB_SELFTEST = function () {
    var log = [], P = [], now = nowSec(), i, j;
    // 1) Round-trip encode/decode
    var states = [
      { iv: 1, b: 0, paused: false, anchor: now - 30 },
      { iv: 0, b: 3, paused: false, anchor: now - 400 },
      { iv: 2, b: 7, paused: false, anchor: now - 3600 },
      { iv: 1, b: 4, paused: true, anchor: 100 },
      { iv: 2, b: 0, paused: true, anchor: 0 },
      { iv: 2, b: 6, paused: true, anchor: 420 }
    ];
    var kb = Math.ceil(now / B.M) * B.M; states.push({ iv: 1, b: 2, paused: false, anchor: kb - 5, _now: kb + 100 });
    states.forEach(function (s, k) {
      var c = B.encode(s), n = s._now || now, d = B.decode(B.fmtCode(c).toLowerCase(), n);
      if (!/^[0-9A-HJKMNP-TV-Z]{7}$/.test(c)) P.push('code ' + c + ' has unexpected characters');
      if (!d.state) { P.push('state ' + k + ' failed to decode: ' + d.error); return; }
      var ok = d.state.iv === s.iv && d.state.b === s.b && d.state.paused === s.paused && (s.paused ? d.state.within === s.anchor : d.state.t0 === s.anchor);
      if (!ok) P.push('state ' + k + ' did not round-trip (' + c + ')');
    });
    log.push('round-trip ' + states.length + ' session states');
    // 2) Checksum rejects every single-character corruption; wrong tags rejected
    var base = B.encode(states[0]), accepted = 0, tried = 0;
    for (i = 0; i < 7; i++) for (j = 0; j < 32; j++) {
      if (B.ALPHA[j] === base[i]) continue;
      var bad = base.slice(0, i) + B.ALPHA[j] + base.slice(i + 1); tried++;
      if (B.decode(bad, now).state) accepted++;
    }
    if (accepted) P.push(accepted + ' corrupted codes were accepted');
    log.push('checksum rejected ' + (tried - accepted) + '/' + tried + ' single-character corruptions');
    if (B.decode('ABC-DEF', now).state || B.decode('ABC-DEFU!', now).state || B.decode('', now).state) P.push('malformed code accepted');
    [0, 1, 2].forEach(function (tag) { var v = (((tag * 4 + 1) * 2) * 8) * B.M + 5, ch = []; for (var q = 5; q >= 0; q--) { ch[q] = v % 32; v = Math.floor(v / 32); } ch.push(B.checksum(ch)); if (B.decode(ch.map(function (x) { return B.ALPHA[x]; }).join(''), now).state) P.push('code with lab tag ' + tag + ' accepted (CISA B5 uses tag 2)'); });
    // 3) Inject derivation at sample times
    var I = B.IVS[1], t0 = 1800000000;
    [[0, 0], [I - 1, 0], [I, 1], [3 * I - 1, 2], [7 * I, 7], [7 * I + 9999, 7], [-50, 0]].forEach(function (c) {
      var d = B.derive({ iv: 1, b: 0, paused: false, t0: t0 }, t0 + c[0]); if (d.idx !== c[1]) P.push('running b=0 at +' + c[0] + 's gave inject ' + (d.idx + 1) + ', expected ' + (c[1] + 1));
    });
    var I0 = B.IVS[0], d3 = B.derive({ iv: 0, b: 3, paused: false, t0: t0 }, t0 + 2 * I0 + 10); if (d3.idx !== 5 || d3.within !== 10) P.push('running b=3, fast pace, two windows plus 10 s should be inject 6 with 10 s elapsed');
    var d4 = B.derive({ iv: 2, b: 7, paused: false, t0: t0 }, t0 + 30); if (d4.nextIn !== null || d4.idx !== 7) P.push('final inject should have no next release');
    [0, 500, 99999].forEach(function (dt) { var x4 = B.INJECTS[4], x5 = B.INJECTS[5], d = B.derive({ iv: 1, b: 4, paused: true, within: 150 }, t0 + dt); if (d.idx !== 4 || d.nextIn !== null || Math.abs(d.sim - (x4.t + (x5.t - x4.t) * 0.5)) > 1e-9) P.push('paused state drifted at +' + dt + 's'); });
    var dr = B.derive({ iv: 1, b: 4, paused: false, t0: t0 - 120 }, t0); if (dr.idx !== 4 || dr.within !== 120) P.push('resume anchor should keep the elapsed time in the inject');
    var pc = B.decode(B.encode({ iv: 1, b: 2, paused: true, anchor: 90 }), now).state, rc = B.decode(B.encode({ iv: 1, b: 2, paused: false, anchor: now - 90 }), now).state;
    if (B.derive(pc, now + 5000).idx !== 2 || B.derive(rc, now + I - 90).idx !== 3 || B.derive(rc, now + I - 91).idx !== 2) P.push('decoded pause/resume derivation wrong');
    log.push('inject derivation checked at sample times, including paused states');
    // 4) Consequence model: the IMP-supported path, re-derived independently
    var X = B.INJECTS, best = X.map(function (x) { return x.best; });
    var dt = 0, cost = 0, ex = 0, rep = 100;
    X.forEach(function (x) { var o = x.opts[x.best].d; dt += x.base.dt + o.dt; cost += x.base.cost + o.cost; ex += x.base.ex + o.ex; rep += x.base.rep + o.rep; if (x.opts[x.best].flag) P.push(x.id + ' best option should not set a penalty flag'); });
    var tot = cost + B.BI_RATE * dt;
    if (dt !== B.answers.bestDowntime()) P.push('best-path downtime mismatch: ' + dt + ' vs ' + B.answers.bestDowntime());
    if (Math.abs(tot / 1000 - B.answers.bestCostM()) > 1e-9) P.push('best-path cost mismatch');
    // The checklist keys must match the inject keys and options
    LAB.checklist.forEach(function (it) { if (it.inj == null) return; var x = X[it.inj]; if (it.answer !== x.best) P.push(it.id + ' key differs from ' + x.id + ' best'); if (it.options.join('|') !== x.opts.map(function (o) { return o.t; }).join('|')) P.push(it.id + ' options differ from the workbench'); });
    // Exhaustive: the IMP path is lowest total cost, lowest exposure, and highest reputation of all 65,536 paths
    var path = [0, 0, 0, 0, 0, 0, 0, 0], beat = 0, ties = 0, minDt = 1e9, n = 0;
    for (var code = 0; code < 65536; code++) {
      for (i = 0; i < 8; i++) path[i] = (code >> (2 * i)) & 3;
      var m = B.model(path, 8); n++;
      if (m.dt < minDt) minDt = m.dt;
      if (path.join() === best.join()) continue;
      if (m.total < tot || m.rep > rep || m.ex < ex) beat++;
      if (m.total === tot) ties++;
    }
    if (beat) P.push(beat + ' paths beat the IMP path on cost, exposure, or reputation');
    if (ties) P.push(ties + ' paths tie the IMP path on total cost');
    // Every option produces a visibly different consequence within its inject
    X.forEach(function (x) { var sig = x.opts.map(function (o) { return [o.d.dt, o.d.ex, o.d.cost, o.d.rep].join(); }); if (sig.filter(function (s, k) { return sig.indexOf(s) === k; }).length !== 4) P.push(x.id + ' has options with identical consequences'); });
    // Option-length balance: the keyed option is never the strictly longest
    X.forEach(function (x) { var L = x.opts.map(function (o) { return o.t.length; }), bl = L[x.best]; if (L.every(function (v, k) { return k === x.best || v < bl; })) P.push(x.id + ' keyed option is the longest'); });
    var letters = best.map(function (b) { return 'ABCD'[b]; }).join('');
    for (i = 1; i < 8; i++) if (X[i].t <= X[i - 1].t) P.push('inject times not increasing');
    log.push('IMP path ' + letters + ': downtime ' + dt + ' h (fastest possible ' + minDt + ' h), exposure ' + ex + 'K, total ' + B.money(tot) + ', reputation ' + rep + '; checked ' + n + ' paths');
    return { log: log, problems: P };
  };
})();
</script>

<script>
window.LAB = {
  id: 'B6',
  title: 'Ransomware Incident Command Tabletop',
  accent: 'Incident Command',
  domain: 'Domain 4',
  time: '60–90 min',
  level: 'Advanced',
  lessonHref: 'lesson06.html#s4',
  lessonLabel: 'Lesson 6, Containment, Eradication & Recovery',
  lede: 'In this tabletop you lead. As the incident manager for a manufacturer hit by ransomware with data extortion, decide at each of eight injects, watch the impact clock respond, and defend your path in a post-incident review.',
  workbenchTitle: 'Incident command workbench',
  ticket: {
    number: 'IR-2026-0317',
    priority: 'Severity 1 candidate',
    from: 'Elena Marchetti, CISO',
    to: 'Security manager and on-call incident manager (you)',
    subject: 'Ransomware at Plant 2: you have incident command',
    due: 'Post-incident review due within 14 days of recovery (IMP 6.1)',
    body: '<p>Halvard Precision Components makes machined parts for aerospace and medical device customers from three plants. At 01:31 this Saturday, the SOC saw encryption on Plant 2 servers and a large transfer of data out of the network. It looks like double extortion: encrypt, steal, and threaten to publish.</p>' +
      '<p>Under the Incident Management Plan, <b>you are the incident manager</b>. You direct the response; the executive crisis team owns the business decisions, and you bring those decisions to it with a recommendation. I will sit on the crisis team and back you, but I will not run the response for you.</p>' +
      '<p>Eight injects will arrive over the next three days of incident time. At each one, commit a decision. Your choices drive the impact clock: <b>downtime, data exposure, total cost, and reputation</b>. Use the IMP, the notification matrix, and the board’s risk appetite on the workbench. Fast is not always right. Neither is cautious.</p>' +
      '<p>When it is over, lead the post-incident review: what happened, what you learned, and three program changes you will take to the steering committee.</p>'
  },
  howTo: 'Choose a mode on the <b>Exercise</b> tab. <b>Solo</b>: release each inject yourself after you commit a decision. <b>Facilitator</b>: for the projector; start the clock, show the session code, and display each inject with its options for discussion. <b>Team</b>: type the projector’s session code on your device; timing follows the facilitator, and your team’s decisions stay on your device. If the facilitator pauses or skips ahead, a new code appears; enter it to re-sync. Decision items unlock as you commit each decision. When all eight are committed, the <b>what-if replay</b> opens for the number items. The report shows your path. Team mode: enter the team name and members on the report.',
  workIntro: 'Release or follow the injects on the <b>Exercise</b> tab, check each option against the <b>Incident plan</b> and the <b>Team and context</b> documents, and commit a decision. Watch the impact clock. Checklist items unlock as your decisions are committed.',
  checklist: [
    { id: 'd1', inj: 0, type: 'choice', points: 7, short: 'I1: containment', title: 'Inject 1: first containment decision',
      locked: B6UI.lockDecision(1),
      task: 'Encryption is spreading from Plant 2, a domain account is being misused, and data is leaving the network. Which decision <b>best</b> meets IMP 3.1 and the board’s risk appetite?',
      options: B6.INJECTS[0].opts.map(function (o) { return o.t; }), answer: 1,
      hint: 'IMP 3.1 asks for three things at once: stop the spread, stop the exfiltration, and keep unaffected operations running where safe. Which option does all three without destroying evidence?',
      debrief: '<p>Targeted isolation stops the spread and the exfiltration at the source: the compromised account and the outbound channel. It keeps Plants 1 and 3 producing, and it leaves the infected servers powered on so volatile evidence can be captured. A full shutdown buys certainty at the cost of two clean plants and the memory evidence, and watching the attacker trades customer data for intelligence the business never asked for.</p><p>The manager’s job here is proportion. Containment is a business decision about acceptable loss, not a technical reflex. The incident manager directs the specialists to contain in a way that matches the risk appetite: low tolerance for data loss, moderate tolerance for short delays. Restoring before the attacker is out simply invites re-encryption.</p>',
      reviewNote: 'Contain proportionately: isolate segments and accounts, block egress, preserve evidence, keep clean operations running.' },
    { id: 'd2', inj: 1, type: 'choice', points: 7, short: 'I2: escalation', title: 'Inject 2: severity and escalation',
      locked: B6UI.lockDecision(2),
      task: 'It is 02:50 on a Saturday. ERP is down at Plant 2 and exfiltration is confirmed. Which decision <b>best</b> follows the IMP?',
      options: B6.INJECTS[1].opts.map(function (o) { return o.t; }), answer: 0,
      hint: 'Read the Severity 1 criteria in IMP 2.1. How many of them are met, and who owns business decisions under IMP 1.2?',
      debrief: '<p>The incident meets Severity 1 on all three criteria: a critical process down for more than two hours, confirmed exfiltration, and active ransomware. IMP 2.1 requires the crisis team within one hour at any hour. Holding the incident inside IT or filtering it through the CIO delays every decision only executives can make: spending, plant operations, statements, and payments.</p><p>Escalation is not a sign of weakness. It puts business decisions with the people who own the risk. The incident manager keeps directing the response and brings options to the crisis team; the board is informed through the CEO, and it governs rather than commands the technical work.</p>',
      reviewNote: 'Classify by business impact against the IMP matrix; Severity 1 means the executive crisis team, at any hour.' },
    { id: 'd3', inj: 2, type: 'choice', points: 7, short: 'I3: outside parties', title: 'Inject 3: counsel, insurer, and forensics',
      locked: B6UI.lockDecision(3),
      task: 'IT wants its familiar forensics firm now. Which sequence of outside engagements <b>best</b> protects Halvard?',
      options: B6.INJECTS[2].opts.map(function (o) { return o.t; }), answer: 3,
      hint: 'IMP 3.2 says who retains forensics and why, and the policy terms say which vendors are reimbursed. What does each option do to privilege and coverage?',
      debrief: '<p>Notifying the insurer early and having breach counsel retain a panel forensics firm protects two things the company will need later: insurance coverage for response costs and legal privilege over the findings. Hiring a non-panel firm directly gains two hours but loses roughly $420K in unreimbursed fees and privilege. Waiting for the insurer to do everything stalls the response, and doing forensics in house misses what specialists find.</p><p>Engaging outside parties is sequencing, not paperwork. The incident manager knows the contracts before the incident: who to call first, what the policy requires, and which vendors are preapproved. That preparation turns a weekend scramble into a 30-minute decision.</p>',
      reviewNote: 'Insurer notice and breach counsel come first; counsel retains panel forensics to protect privilege and coverage.' },
    { id: 'd4', inj: 3, type: 'choice', points: 7, short: 'I4: evidence', title: 'Inject 4: preserve evidence before rebuild',
      locked: B6UI.lockDecision(4),
      task: 'The COO wants the ERP servers wiped and rebuilt now. What should the incident manager <b>recommend</b>?',
      options: B6.INJECTS[3].opts.map(function (o) { return o.t; }), answer: 1,
      hint: 'IMP 4.1 sets the order of operations and the scope of preservation. What happens to the notification scope if nobody can prove what was taken?',
      debrief: '<p>Imaging the in-scope systems first costs about three hours, and a clean parallel enclave keeps the rebuild moving. Skipping imaging is faster by four hours but expensive: without evidence, counsel must treat every share as exposed, which widens notification and invites an insurance dispute. Imaging all 400 systems overshoots, and cleaning in place leaves the attacker’s access behind.</p><p>The manager reframes the COO’s request as a trade-off the crisis team can own: hours of production against the ability to prove scope, recover costs, and avoid over-notifying. Preservation is scoped to what the investigation needs, and recovery runs in parallel rather than waiting.</p>',
      reviewNote: 'Capture evidence on in-scope systems before rebuild, and rebuild in parallel in a clean environment.' },
    { id: 'd5', inj: 4, type: 'choice', points: 7, short: 'I5: communication', title: 'Inject 5: what to tell customers, and when',
      locked: B6UI.lockDecision(5),
      task: 'The leak site names Halvard and shows real samples. Customers and a reporter are calling. Which communication decision is <b>best</b>?',
      options: B6.INJECTS[4].opts.map(function (o) { return o.t; }), answer: 2,
      hint: 'IMP 5.1 names one spokesperson, a time limit, and two things to avoid. The board has low tolerance for loss of customer trust.',
      debrief: '<p>Once the attacker has gone public, silence is a message, and a denial is a liability waiting to be contradicted. The approved holding statement, issued by the one named spokesperson, says what is known, what is being done, and when the next update will come. Scripted briefings for key accounts keep customers hearing from Halvard before they hear from the leak site.</p><p>Communication is a core incident management control. The incident manager makes sure the plan’s templates, spokesperson, and approval path exist before the incident, and that counsel reviews statements without slowing them past the four-hour window.</p>',
      reviewNote: 'Communicate early and accurately through one spokesperson; never deny ahead of the facts.' },
    { id: 'd6', inj: 5, type: 'choice', points: 7, short: 'I6: extortion', title: 'Inject 6: the extortion demand',
      locked: B6UI.lockDecision(6),
      task: 'VELLUM demands $4.2 million and threatens to publish 410 GB. Backups are clean and restoration is on track. Which response <b>best</b> follows Halvard’s policy?',
      options: B6.INJECTS[5].opts.map(function (o) { return o.t; }), answer: 0,
      hint: 'Read IMP 5.2 closely: who may communicate with the attacker, who decides on payment, what must happen first, and what the default is when backups work.',
      debrief: '<p>The policy settles who decides and how: no staff contact, counsel and the insurer advise, sanctions screening happens first, and the CEO and board decide. With clean backups, the default is not to pay, and the decision is recorded. Paying does not guarantee deletion, a staff chat hands the attacker leverage, and public taunting brings the full dump forward.</p><p>A ransom decision is a governance decision made under a policy the board approved in calm conditions. The incident manager’s role is to give the decision makers the facts: restoration status, data at risk, and legal and sanctions considerations, not to negotiate or decide alone.</p>',
      reviewNote: 'Ransom decisions follow board policy: no staff contact; counsel, insurer, and sanctions screening; CEO and board decide.' },
    { id: 'd7', inj: 6, type: 'choice', points: 7, short: 'I7: notification', title: 'Inject 7: law enforcement and notifications',
      locked: B6UI.lockDecision(7),
      task: 'Customer drawings and employee records are confirmed stolen. Some executives fear that a law enforcement report will add publicity. Which recommendation is <b>best</b>?',
      options: B6.INJECTS[6].opts.map(function (o) { return o.t; }), answer: 3,
      hint: 'Open Appendix N. Note the triggers, the internal deadlines, and the owner. When did the 72-hour customer clock start?',
      debrief: '<p>Appendix N makes law enforcement reporting a standard step for confirmed ransomware, and it puts every notice through counsel with a named owner and deadline. The 72-hour customer clause started when the drawings were confirmed, not when forensics finishes. Avoiding law enforcement forfeits intelligence and looks evasive, holding notices misses contracts, and notifying everyone at once spreads errors.</p><p>The incident manager does not give legal advice; the General Counsel owns notification. The manager makes sure the matrix is worked on time, that facts given to counsel are accurate, and that the crisis team sees which deadlines are approaching.</p>',
      reviewNote: 'Report confirmed ransomware to law enforcement through counsel and work the notification matrix to its deadlines.' },
    { id: 'd8', inj: 7, type: 'choice', points: 7, short: 'I8: recovery', title: 'Inject 8: when to declare recovery',
      locked: B6UI.lockDecision(8),
      task: 'ERP is back at two plants, validation at Plant 3 is unfinished, and 80 percent of credentials are reset. The COO wants closure. What do you <b>recommend</b>?',
      options: B6.INJECTS[7].opts.map(function (o) { return o.t; }), answer: 2,
      hint: 'IMP 4.2 lists the exit criteria and says who recommends and who declares. Which criteria are still open?',
      debrief: '<p>Recovery is declared against criteria, not against fatigue. With validation open at Plant 3 and a fifth of credentials unreset, the attacker may still have a way back in. Meeting the IMP exit criteria costs about twelve more hours, while closing early risks a second outage, and a full rebuild of everything overshoots the remaining risk.</p><p>The incident manager recommends; the crisis team declares, with business owner sign-off. Enhanced monitoring after recovery turns the decision into a managed risk rather than a hope, and it gives the post-incident review evidence that eradication worked.</p>',
      reviewNote: 'Declare recovery when the exit criteria are met: eradication validated, credentials reset, monitoring in place, owner sign-off.' },
    { id: 'dt', type: 'number', points: 12, short: 'IMP path downtime', title: 'Downtime under the IMP-supported path',
      locked: B6UI.lockAll, unit: 'hours', tol: 0.5,
      task: 'In the <b>what-if replay</b>, set all eight decisions to the IMP-supported answers from items 1 to 8 (the <b>Apply my verified checklist answers</b> button helps). What is the total <b>downtime</b>?',
      answer: function () { return B6.answers.bestDowntime(); },
      hint: 'Verify items 1 to 8 first, then apply them in the replay and read the downtime row in the What-if column. Some other paths are faster; that is the point of item 10.',
      debrief: '<p>The IMP-supported path restores operations in 83 hours: about 60 hours of unavoidable impact from the attack, plus targeted containment, evidence capture, and the time to meet the recovery exit criteria. Several other paths are faster, for example rebuilding without imaging or paying the ransom, and the fastest possible path is 15 hours shorter.</p><p>Downtime is one measure, not the goal. The manager optimizes for the whole risk picture the board set: customer trust, data exposure, contractual exposure, and total cost. A faster restart that widens exposure or weakens recovery is not a better outcome.</p>',
      reviewNote: 'Read the What-if column after applying the IMP-supported decisions; the best path is not the fastest.' },
    { id: 'cost', type: 'number', points: 12, short: 'IMP path cost', title: 'Total cost under the IMP-supported path',
      locked: B6UI.lockAll, unit: '$ millions', tol: 0.01,
      task: 'With the same what-if path, what is the <b>total cost</b>, including business interruption, in millions of dollars (for example, 4.25)?',
      answer: function () { return B6.answers.bestCostM(); },
      hint: 'Use the Total cost row, What-if column. Total cost is direct cost plus $30K per downtime hour.',
      debrief: '<p>The IMP-supported path costs $3.79 million: $1.30 million in direct response cost and $2.49 million in business interruption for 83 hours. No other combination of decisions costs less, and none ends with lower exposure or a higher reputation score. Paying the ransom alone would have added more than $4 million in direct cost while saving only six hours.</p><p>Putting a number on each path lets the crisis team see the trade-offs it is making and lets the post-incident review show the board the value of preparation: panel vendors, a holding statement, a ransom policy, and exit criteria all reduced cost because they existed before the incident.</p>',
      reviewNote: 'Total cost = direct cost + downtime hours x $30K; compare paths on the whole picture, not only speed.' },
    { id: 'pir', type: 'text', points: 20, short: 'Post-incident review', title: 'Post-incident review', reportTitle: 'Post-incident review',
